[build-system]
requires = ["hatchling>=1.21"]
build-backend = "hatchling.build"

[project]
name = "quantlab"
version = "0.1.0"
description = "Institutional-style quantitative research framework: data, factors, backtesting, portfolio construction, risk, and ML alpha pipelines."
readme = "README.md"
requires-python = ">=3.11"
license = { text = "MIT" }
authors = [{ name = "Michael Williams" }]
keywords = [
    "quantitative-finance",
    "backtesting",
    "portfolio-optimization",
    "alpha-research",
    "factor-investing",
]
classifiers = [
    "Development Status :: 3 - Alpha",
    "Intended Audience :: Financial and Insurance Industry",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Topic :: Office/Business :: Financial :: Investment",
]
dependencies = [
    "numpy>=1.26",
    "pandas>=2.2",
    "scipy>=1.11",
    "scikit-learn>=1.4",
    "matplotlib>=3.8",
    "pyarrow>=14.0",
]

[project.optional-dependencies]
# Live market data connectivity (soft dependency; the framework runs fully
# offline on the synthetic source without it).
data = ["yfinance>=0.2.40"]
# Gradient-boosted trees beyond scikit-learn.
ml = ["lightgbm>=4.0"]
dev = [
    "pytest>=8.0",
    "pytest-cov>=4.1",
    "ruff>=0.4",
    "mypy>=1.9",
]

[project.urls]
Documentation = "https://github.com/michaelwill9/quantlab/tree/main/docs"
Source = "https://github.com/michaelwill9/quantlab"

[tool.hatch.build.targets.wheel]
packages = ["src/quantlab"]

[tool.pytest.ini_options]
testpaths = ["tests"]
addopts = "-q --strict-markers"
markers = [
    "slow: long-running tests (deselect with '-m \"not slow\"')",
]

[tool.ruff]
line-length = 100
target-version = "py311"
src = ["src", "tests"]

[tool.ruff.lint]
select = ["E", "F", "W", "I", "UP", "B", "SIM", "C4", "RET", "PT"]
ignore = [
    "E501",   # line length handled by formatter
    "RET504", # allow named return values for readability
]

[tool.ruff.lint.per-file-ignores]
"tests/*" = ["PT018"]  # composite assertions read fine in this suite

[tool.ruff.lint.isort]
known-first-party = ["quantlab"]

[tool.mypy]
# 3.12 target: numpy >= 2.5 type stubs use `type` statements (PEP 695).
# Runtime support remains 3.11+ (requires-python above).
python_version = "3.12"
packages = ["quantlab"]
mypy_path = "src"
ignore_missing_imports = true
warn_unused_ignores = true
warn_redundant_casts = true
no_implicit_optional = true
check_untyped_defs = true

[tool.coverage.run]
source = ["src/quantlab"]
branch = true
